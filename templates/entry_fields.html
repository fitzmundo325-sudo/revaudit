{% set e = e if e is defined else None %}
<div class="row g-3">
  <div class="col-md-6">
    <label class="form-label">Payee</label>
    <input type="text" name="payee" class="form-control" value="{{ e.payee if e else '' }}" required>
  </div>
  <div class="col-md-3">
    <label class="form-label">Branch</label>
    <input type="text" name="branch" class="form-control" value="{{ e.branch if e else '' }}">
  </div>
  <div class="col-md-3">
    <label class="form-label">Transaction Date</label>
    <input type="date" name="trxn_date" class="form-control" value="{{ e.trxn_date.strftime('%Y-%m-%d') if e and e.trxn_date else '' }}">
  </div>
  <div class="col-12">
    <label class="form-label">Particulars</label>
    <textarea name="particulars" class="form-control" rows="2">{{ e.particulars if e else '' }}</textarea>
  </div>
  <div class="col-md-4">
    <label class="form-label">Ref#</label>
    <input type="text" name="ref_no" class="form-control" value="{{ e.ref_no if e else '' }}">
  </div>
  <div class="col-md-4">
    <label class="form-label">Account Title</label>
    <select name="account_title" class="form-select" required>
      <option value="" disabled {% if not e %}selected{% endif %}>Select…</option>
      {% for a in account_titles %}
        <option value="{{ a }}" {% if e and e.account_title==a %}selected{% endif %}>{{ a }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-4">
    <label class="form-label">Amount (₱)</label>
    <input type="number" step="0.01" min="0" name="amount" class="form-control" value="{{ e.amount if e else '' }}" required>
  </div>
  <div class="col-md-6">
    <label class="form-label">TIN</label>
    <input type="text" name="tin" class="form-control" value="{{ e.tin if e else '' }}">
  </div>
  <div class="col-md-6">
    <label class="form-label">Address</label>
    <input type="text" name="address" class="form-control" value="{{ e.address if e else '' }}">
  </div>
  <div class="col-md-6">
    <label class="form-label">Prepared By</label>
    <input type="text" name="prepared_by" class="form-control" value="{{ e.prepared_by if e else 'Jenny Rose Ando' }}">
  </div>
</div>
