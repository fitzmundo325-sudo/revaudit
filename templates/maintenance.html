<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maintenance · Revolving Fund</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<style>
  body{ font-family:'Inter',-apple-system,'Segoe UI',Roboto,sans-serif; -webkit-font-smoothing:antialiased;
        min-height:100vh; background:linear-gradient(135deg, #14301f 0%, #245136 55%, #3d6b45 100%);
        display:flex; align-items:center; justify-content:center; padding:1rem; }
  .maintenance-card{ width:100%; max-width:440px; background:#fff; border-radius:18px; padding:2.5rem 2.2rem;
                     box-shadow:0 20px 50px rgba(0,0,0,.35); text-align:center; }
  .wrench-icon{ width:64px; height:64px; border-radius:16px; background:linear-gradient(135deg, #c98b3a, #b07a28);
                display:flex; align-items:center; justify-content:center; font-size:1.7rem; color:#fff;
                box-shadow:0 8px 18px rgba(201,139,58,.45); margin:0 auto 1.2rem; }
  .maintenance-title{ font-weight:800; letter-spacing:-.01em; color:#1f2937; font-size:1.5rem; }
  .maintenance-sub{ color:#6b7280; font-size:.9rem; margin-top:.4rem; }
</style>
</head>
<body>
<div class="maintenance-card">
  <div class="wrench-icon"><i class="fa-solid fa-screwdriver-wrench"></i></div>
  <h1 class="maintenance-title mb-1">Under Maintenance</h1>
  <div class="maintenance-sub">{{ maintenance_mode.message or 'The Revolving Fund system is currently undergoing maintenance. Please check back shortly.' }}</div>
  <a href="{{ url_for('auth.login') }}" class="btn btn-brand mt-4 px-4">Try Again</a>
</div>
<style>
  .btn-brand{ background-color:#245136; border-color:#245136; color:#fff; border-radius:.6rem; font-weight:600;
              box-shadow:0 4px 12px rgba(36,81,54,.3); }
  .btn-brand:hover{ background-color:#1a3d27; border-color:#1a3d27; color:#fff; }
</style>
</body>
</html>
